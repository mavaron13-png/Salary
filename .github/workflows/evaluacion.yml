name: MLOps - Evaluación Anual del Modelo

# El flujo se dispara manualmente desde el botón de GitHub o cada vez que hagas push a main
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  evaluar_y_versionar:
    runs-on: ubuntu-latest

    # Definimos las variables de entorno necesarias para que Python no se rompa
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
    - name: 📥 Clonar Repositorio
      uses: actions/checkout@v4

    - name: 🐍 Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 📦 Instalar Dependencias del Servidor
      run: |
        python -m pip install --upgrade pip
        pip install xgboost pandas mlflow scikit-learn

    - name: 🚀 Ejecutar Evaluación con MLflow
      run: |
        python evaluar_modelo.py

    - name: 💾 Persistir Logs de MLflow en el Repositorio
      run: |
        git config --global user.name "MLOps Bot"
        git config --global user.email "mlops-bot@users.noreply.github.com"
        git add mlflow_runs/ resumen_evaluacion.json
        # Solo hace commit si hubo cambios en las métricas para no romper el flujo
        git diff-index --quiet HEAD || git commit -m "chore(mlops): actualización automática de métricas de MLflow [skip ci]"
        git push origin main